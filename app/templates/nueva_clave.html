{% extends "base.html" %}
{% block titulo %}Nueva contraseña{% endblock %}
{% block contenido %}
<h1>Nueva contraseña</h1>
{% if caducado %}
  <div class="tarjeta">
    <p class="aviso aviso-error" role="alert">El enlace ha caducado o ya se ha usado.</p>
    <p><a class="boton" href="{{ url_for('auth.olvido') }}">Pedir otro enlace</a></p>
  </div>
{% else %}
  <form method="post" class="tarjeta">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    {% if error %}<p class="aviso aviso-error" role="alert">{{ error }}</p>{% endif %}
    <label for="clave">Contraseña nueva <span class="ayuda">Al menos 8 caracteres, con una letra y un número.</span></label>
    <input type="password" id="clave" name="clave" autocomplete="new-password" required autofocus>
    <label for="repetir">Repita la contraseña</label>
    <input type="password" id="repetir" name="repetir" autocomplete="new-password" required>
    <button type="submit" class="ancho">Guardar contraseña</button>
  </form>
{% endif %}
{% endblock %}
