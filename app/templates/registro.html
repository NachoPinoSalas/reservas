{% extends "base.html" %}
{% block titulo %}Registrarse{% endblock %}
{% block contenido %}
<h1>Registrarse</h1>
<form method="post" class="tarjeta">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  {% if errores %}<ul class="errores" role="alert">{% for e in errores %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
  <div class="dos-columnas">
    <div>
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" value="{{ datos.nombre }}" autocomplete="given-name" required>
    </div>
    <div>
      <label for="apellidos">Apellidos</label>
      <input type="text" id="apellidos" name="apellidos" value="{{ datos.apellidos }}" autocomplete="family-name" required>
    </div>
  </div>
  <label for="email">Email</label>
  <input type="email" id="email" name="email" value="{{ datos.email }}" autocomplete="email" autocapitalize="none" required>
  <label for="telefono">Teléfono</label>
  <input type="tel" id="telefono" name="telefono" value="{{ datos.telefono }}" autocomplete="tel" required>
  <label for="nif">NIF <span class="ayuda">Opcional.</span></label>
  <input type="text" id="nif" name="nif" value="{{ datos.nif }}">
  <label for="clave">Contraseña <span class="ayuda">Al menos 8 caracteres, con una letra y un número.</span></label>
  <input type="password" id="clave" name="clave" autocomplete="new-password" required>
  <button type="submit" class="ancho">Crear cuenta</button>
</form>
<p>¿Ya tiene cuenta? <a href="{{ url_for('auth.entrar') }}">Entrar</a></p>
{% endblock %}
